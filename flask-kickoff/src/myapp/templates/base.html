<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plataforma Q&A{% endblock %}</title>
</head>
<body>
  <header>
    <nav>
      <a href="{{ url_for('users.index') }}">Usuarios</a> |
      <a href="{{ url_for('users.register') }}">Registrarse</a>
      <a href="{{ url_for('web_categories.manage') }}">Categorías</a>
      <a href="{{ url_for('users.login') }}">Iniciar sesión</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>
          {% for msg in messages %}
            <li>{{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
