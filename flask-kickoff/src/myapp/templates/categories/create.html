{% extends "base.html" %}

{% block title %}Nueva Categoría{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Crear Categoría</h1>

        <form method="post" action="{{ url_for('web_categories.create_category_web') }}">
          <div class="mb-3">
            <label for="name" class="form-label">Nombre de la categoría:</label>
            <input id="name" name="name" type="text" class="form-control" maxlength="120" required>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Crear</button>
            <a href="{{ url_for('web_categories.manage') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
