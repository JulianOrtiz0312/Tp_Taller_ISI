{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Nueva Pregunta</h1>

        {% if error %}
          <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="post">
          <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input
              type="text"
              id="titulo"
              name="titulo"
              class="form-control"
              maxlength="200"
              value="{{ titulo or '' }}"
              required
            >
          </div>

          <div class="mb-3">
            <label for="category_id" class="form-label">Categoría</label>
            <select id="category_id" name="category_id" class="form-select" required>
              <option value="">-- Seleccioná una categoría --</option>
              {% for cat in categories %}
                <option
                  value="{{ cat.id }}"
                  {% if selected_category_id == cat.id %}selected{% endif %}
                >
                  {{ cat.name }}
                </option>
              {% endfor %}
            </select>
          </div>

          <div class="mb-3">
            <label for="cuerpo" class="form-label">Cuerpo de la pregunta</label>
            <textarea id="cuerpo" name="cuerpo" class="form-control" rows="5" required>{{ cuerpo or '' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Publicar pregunta</button>
            <a href="{{ url_for('questions.index') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
