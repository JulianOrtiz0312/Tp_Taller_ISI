{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Preguntas</h1>
  <a href="{{ url_for('questions.create') }}" class="btn btn-primary">Nueva pregunta</a>
</div>

<div class="card shadow-sm">
  <div class="card-body p-0">
    {% if questions %}
      <div class="list-group list-group-flush">
        {% for question in questions %}
          <a href="{{ url_for('questions.detail', question_id=question.id) }}" class="list-group-item list-group-item-action py-3">
            <div class="d-flex w-100 justify-content-between align-items-center">
              <strong class="text-primary">{{ question.title }}</strong>
              <small class="text-muted">por {{ question.user.name }}</small>
            </div>
          </a>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-muted p-3 mb-0">Todavía no hay preguntas publicadas.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
