{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Preguntas</h1>
  <a href="{{ url_for('questions.create') }}" class="btn btn-primary">Nueva pregunta</a>
</div>

  <p><a href="{{ url_for('questions.create') }}">Nueva pregunta</a></p>

  {% if questions %}
    <ul>
      {% for question in questions %}
        <li>
          <a href="{{ url_for('questions.detail', question_id=question.id) }}">
            <strong>{{ question.titulo }}</strong>
          </a>
        {% endfor %}
      </div>
    {% else %}
      <p class="text-muted p-3 mb-0">Todavía no hay preguntas publicadas.</p>
    {% endif %}
  </div>
</div>
{% endblock %}
